<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Top Up Kredit - DeepChat</title>
  <!-- Ganti dengan Client Key Sandbox/Production kamu -->
  <script src="https://app.sandbox.midtrans.com/snap/snap.js" data-client-key="Mid-client-8mPggar1PjJg-aQM"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f3f4f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 400px; }
    h2 { text-align: center; color: #1f2937; margin-top: 0; }
    p.subtitle { text-align: center; color: #6b7280; margin-bottom: 24px; font-size: 14px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
    .nominal-btn { background: #f9fafb; border: 2px solid #e5e7eb; padding: 16px; border-radius: 12px; text-align: center; cursor: pointer; transition: all 0.2s; font-weight: 600; color: #374151; }
    .nominal-btn:hover { border-color: #3b82f6; background: #eff6ff; color: #1d4ed8; }
    .nominal-btn.active { border-color: #3b82f6; background: #3b82f6; color: white; }
    .btn-pay { width: 100%; padding: 16px; background: #10b981; color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    .btn-pay:hover { background: #059669; }
    .btn-pay:disabled { background: #9ca3af; cursor: not-allowed; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Top Up Kredit</h2>
    <p class="subtitle">Pilih nominal top-up. Kredit akan otomatis masuk.</p>
    
    <div class="grid" id="nominal-grid">
      <div class="nominal-btn" data-amount="10000">Rp 10.000</div>
      <div class="nominal-btn" data-amount="20000">Rp 20.000</div>
      <div class="nominal-btn" data-amount="50000">Rp 50.000</div>
      <div class="nominal-btn" data-amount="100000">Rp 100.000</div>
    </div>

    <button class="btn-pay" id="pay-button" disabled>Pilih Nominal Dulu</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // --- KONFIGURASI FIREBASE KAMU ---
    const firebaseConfig = {
      apiKey: "AIza...",
      authDomain: "deepchat-xxx.firebaseapp.com",
      projectId: "deepchat-xxx",
      // ... isi sesuai config firebase kamu
    };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    let selectedAmount = 0;
    let idToken = null;

    // Cek login Firebase
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        idToken = await user.getIdToken();
      } else {
        alert("Silakan login terlebih dahulu!");
        window.location.href = "/"; // Redirect ke halaman login
      }
    });

    // Logika pilih nominal
    const buttons = document.querySelectorAll('.nominal-btn');
    const payBtn = document.getElementById('pay-button');

    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        buttons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedAmount = parseInt(btn.getAttribute('data-amount'));
        payBtn.disabled = false;
        payBtn.textContent = `Bayar Rp ${selectedAmount.toLocaleString('id-ID')}`;
      });
    });

    // Logika tombol Bayar
    payBtn.addEventListener('click', async () => {
      if (!idToken) return alert("Sesi login habis, silakan refresh.");
      if (selectedAmount === 0) return;

      payBtn.disabled = true;
      payBtn.textContent = "Memproses...";

      try {
        const response = await fetch('/api/topup/create', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${idToken}`
          },
          body: JSON.stringify({ amount: selectedAmount })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Gagal membuat transaksi");
        }

        // Munculkan popup Midtrans
        window.snap.pay(data.token, {
          onSuccess: function(result) {
            window.location.href = `/topup-finish?order_id=${data.order_id}`;
          },
          onPending: function(result) {
            window.location.href = `/topup-finish?order_id=${data.order_id}`;
          },
          onError: function(result) {
            alert("Pembayaran gagal!");
            payBtn.disabled = false;
            payBtn.textContent = `Bayar Rp ${selectedAmount.toLocaleString('id-ID')}`;
          },
          onClose: function() {
            payBtn.disabled = false;
            payBtn.textContent = `Bayar Rp ${selectedAmount.toLocaleString('id-ID')}`;
          }
        });

      } catch (error) {
        alert(error.message);
        payBtn.disabled = false;
        payBtn.textContent = `Bayar Rp ${selectedAmount.toLocaleString('id-ID')}`;
      }
    });
  </script>
</body>
</html>
