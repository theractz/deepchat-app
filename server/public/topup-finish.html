<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Status Pembayaran - DeepChat</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f3f4f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: white; padding: 40px 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 400px; text-align: center; }
    .icon { font-size: 50px; margin-bottom: 20px; }
    .status-title { font-size: 20px; font-weight: bold; color: #1f2937; margin-bottom: 10px; }
    .status-desc { color: #6b7280; font-size: 14px; margin-bottom: 30px; }
    .btn-home { display: block; width: 100%; padding: 14px; background: #3b82f6; color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; text-decoration: none; box-sizing: border-box; transition: background 0.2s; }
    .btn-home:hover { background: #2563eb; }
    .countdown-box { background: #fef3c7; color: #92400e; padding: 12px; border-radius: 8px; font-weight: 600; font-size: 14px; margin-bottom: 20px; display: none; }
    .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3b82f6; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 0 auto 20px auto; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="card" id="card">
    <div class="loader" id="loader"></div>
    <div class="icon" id="icon" style="display:none;"></div>
    <div class="status-title" id="title">Memeriksa Pembayaran...</div>
    <div class="status-desc" id="desc">Mohon tunggu sebentar, kami sedang menghubungi server.</div>
    
    <!-- Countdown Box -->
    <div class="countdown-box" id="countdown-box">
      Batas waktu pembayaran: <span id="timer">15:00</span>
    </div>

    <a href="/" class="btn-home" id="btn-home" style="display:none;">Kembali ke Chat</a>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = { /* SAMA SEPERTI DI TOPUP.HTML */ };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Ambil Order ID dari URL
    const urlParams = new URLSearchParams(window.location.search);
    const orderId = urlParams.get('order_id');

    const loader = document.getElementById('loader');
    const icon = document.getElementById('icon');
    const title = document.getElementById('title');
    const desc = document.getElementById('desc');
    const btnHome = document.getElementById('btn-home');
    const countdownBox = document.getElementById('countdown-box');
    const timerElement = document.getElementById('timer');

    let checkInterval = null;
    let countdownInterval = null;
    let timeLeft = 15 * 60; // 15 Menit dalam detik (standar expired Midtrans)

    if (!orderId) {
      title.textContent = "Order ID Tidak Ditemukan";
      desc.textContent = "Silakan kembali ke halaman utama.";
      loader.style.display = 'none';
      btnHome.style.display = 'block';
    } else {
      onAuthStateChanged(auth, async (user) => {
        if (user) {
          const idToken = await user.getIdToken();
          mulaiCekStatus(idToken);
        }
      });
    }

    async function mulaiCekStatus(idToken) {
      // Fungsi untuk ngecek ke backend
      const checkStatus = async () => {
        try {
          const res = await fetch(`/api/topup/status/${orderId}`, {
            headers: { 'Authorization': `Bearer ${idToken}` }
          });
          const data = await res.json();

          if (!res.ok) throw new Error("Gagal cek status");

          if (data.status === 'paid') {
            // BERHASIL
            clearInterval(checkInterval);
            clearInterval(countdownInterval);
            loader.style.display = 'none';
            countdownBox.style.display = 'none';
            icon.innerHTML = '✅';
            icon.style.display = 'block';
            title.textContent = "Pembayaran Berhasil";
            desc.innerHTML = `Top-up sebesar <b>Rp ${data.amount.toLocaleString('id-ID')}</b> berhasil! Kredit kamu sudah bertambah.`;
            btnHome.style.display = 'block';
          } 
          else if (data.status === 'failed') {
            // GAGAL
            clearInterval(checkInterval);
            clearInterval(countdownInterval);
            loader.style.display = 'none';
            countdownBox.style.display = 'none';
            icon.innerHTML = '❌';
            icon.style.display = 'block';
            title.textContent = "Pembayaran Gagal";
            desc.textContent = "Transaksi dibatalkan atau waktu habis. Silakan coba lagi.";
            btnHome.style.display = 'block';
          }
          else {
            // PENDING
            title.textContent = "Menunggu Pembayaran";
            desc.textContent = "Selesaikan pembayaran kamu. Halaman ini akan otomatis diperbarui.";
            countdownBox.style.display = 'block';
            
            // Mulai countdown jika belum jalan
            if (!countdownInterval) mulaiCountdown();
          }
        } catch (error) {
          console.error("Error cek status:", error);
        }
      };

      // Cek langsung saat halaman dibuka
      await checkStatus();

      // Lanjut cek tiap 3 detik
      checkInterval = setInterval(checkStatus, 3000);
    }

    function mulaiCountdown() {
      countdownInterval = setInterval(() => {
        if (timeLeft <= 0) {
          clearInterval(countdownInterval);
          timerElement.textContent = "00:00";
          return;
        }
        timeLeft--;
        const minutes = Math.floor(timeLeft / 60);
        const seconds = timeLeft % 60;
        timerElement.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
      }, 1000);
    }
  </script>
</body>
</html>
