<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <script>try{var t=localStorage.getItem('deepchat_theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=t}catch(e){}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — DeepChat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Style khusus halaman login admin */
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      margin: 0;
      background-color: var(--bg-base);
      position: relative;
      overflow: auto;
      padding: 20px;
    }

    /* Ikon Kunci di atas form */
    .lock-icon {
      width: 64px;
      height: 64px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px auto;
      color: var(--accent);
    }

    .login-box {
      width: 100%;
      max-width: 380px;
      padding: 40px 32px;
      background: var(--bg-glass-strong);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-lg);
      text-align: center;
      position: relative;
      z-index: 10;
    }

    .login-box h2 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .login-box p {
      color: var(--text-secondary);
      font-size: 0.85rem;
      margin-bottom: 24px;
    }

    .input-group {
      text-align: left;
      margin-bottom: 16px;
    }

    .input-group label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 8px;
      font-weight: 500;
    }

    .login-box input {
      width: 100%;
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-glass);
      background: var(--bg-elevated);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .login-box input:focus {
      border-color: var(--accent);
    }

    .login-box button {
      width: 100%;
      padding: 14px;
      border-radius: var(--radius-sm);
      background: var(--accent);
      color: var(--on-accent);
      border: none;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s;
    }

    .login-box button:hover {
      background: var(--accent-hover);
    }

    .login-box button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .error-msg {
      color: var(--danger);
      font-size: 0.85rem;
      margin-top: 16px;
      display: none;
      background: transparent;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--danger);
    }

    .back-link {
      display: inline-block;
      margin-top: 24px;
      color: var(--text-muted);
      font-size: 0.8rem;
      text-decoration: none;
      transition: color 0.2s;
    }

    .back-link:hover {
      color: var(--text-primary);
    }
  </style>
</head>
<body>

  <div class="login-box">
    <div class="lock-icon">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
    </div>
    
    <h2>Admin Area</h2>
    <p>Silakan login untuk mengakses panel kontrol.</p>

    <div class="input-group">
      <label for="username">Username</label>
      <input type="text" id="username" placeholder="Username admin" autocomplete="username">
    </div>

    <div class="input-group">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Password" autocomplete="current-password">
    </div>

    <button id="loginBtn">Masuk ke Panel</button>
    <div class="error-msg" id="errorMsg" role="alert"></div>
    
    <a href="index.html" class="back-link">← Kembali ke Chat</a>
  </div>

  <script>
    const loginBtn = document.getElementById('loginBtn');
    const errorMsg = document.getElementById('errorMsg');

    // Fungsi buat login
    const handleLogin = async () => {
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value.trim();

      if (!user || !pass) {
        errorMsg.textContent = 'Username dan Password wajib diisi.';
        errorMsg.style.display = 'block';
        return;
      }

      loginBtn.textContent = 'Memverifikasi...';
      loginBtn.disabled = true;
      errorMsg.style.display = 'none';

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: user, password: pass })
        });

        const data = await res.json();
        
        if (!res.ok) throw new Error(data.error);

        // Kalau sukses, pindah ke halaman panel rahasia
        window.location.href = '/panel-rahasia';
      } catch (error) {
        errorMsg.textContent = error.message;
        errorMsg.style.display = 'block';
        loginBtn.textContent = 'Masuk ke Panel';
        loginBtn.disabled = false;
      }
    };

    // Jalankan kalau tombol diklik
    loginBtn.addEventListener('click', handleLogin);

    // Jalankan kalau user mencet 'Enter' di keyboard
    document.getElementById('password').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleLogin();
    });
  </script>
</body>
</html>
